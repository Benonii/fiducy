name: AWS deploy

# Run this from main. The deployer role only trusts OIDC tokens from refs/heads/main, there are no
# AWS keys in this repository's secrets, and the run can never change which enclave image the KMS
# key trusts: a new image stops at "built, not yet trusted" until a custodian runs infra/aws/pin.sh.
on:
  workflow_dispatch:
    inputs:
      rotate_token:
        description: Replace the gateway token before building the enclave image
        type: boolean
        default: false

concurrency:
  group: aws-prototype
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      FIDUCY_CONTROL_PLANE_URL: ${{ vars.FIDUCY_CONTROL_PLANE_URL }}
      FIDUCY_DEMO_URL: ${{ vars.FIDUCY_DEMO_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        id: configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ] || [ -z "$FIDUCY_CONTROL_PLANE_URL" ]; then
            echo "Set the AWS_DEPLOY_ROLE_ARN and FIDUCY_CONTROL_PLANE_URL repository variables first. Skipping the deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assume the deployer role
        if: steps.configuration.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy
        if: steps.configuration.outputs.ready == 'true'
        run: bash infra/aws/deploy.sh ${{ inputs.rotate_token == true && '--rotate-token' || '' }}
